[package]
name = "rox-n-desktop"
version = "0.1.0"
description = "ROX N desktop client"
edition = "2021"
rust-version = "1.77"

# stand alone: do not join the parent directory's cargo workspace
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
